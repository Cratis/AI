name: Publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: false
        type: string
      release-notes:
        description: Release notes
        required: false
        default: No release notes
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-intent:
    if: github.event_name == 'pull_request'
    uses: Cratis/Workflows/.github/workflows/verify-release-intent.yml@1e5319ff574ce61a771ec5199527b917204a13b5

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The three TypeScript projects moved into a yarn workspace in the .NET-scaffolding PR - a
      # single `yarn install` at the root replaces the old per-project `npm ci --prefix`, which
      # would now fail outright (their package-lock.json files were deleted in that move).
      - name: Install project dependencies
        run: corepack enable && yarn install --immutable

      - name: Type check
        run: |
          yarn workspace @cratis/harness-setup run check
          yarn workspace @cratis/pi run check
          yarn workspace @cratis/ai-verification run check

      - name: Verify corpus and skill behavior
        run: yarn workspace @cratis/ai-verification run verify

      - name: Test Pi package behavior
        run: yarn workspace @cratis/ai-verification run test

      - name: Verify Pi package contents
        run: cd Source/Pi.Plugin && yarn pack --dry-run

      - name: Lint runtime shell scripts
        run: |
          mapfile -t scripts < <(find .cratis/ai/hooks/scripts -maxdepth 1 -name '*.sh' | sort)
          test ${#scripts[@]} -gt 0
          shellcheck --external-sources --severity=style "${scripts[@]}"

      - name: Reject whitespace errors
        run: git diff --check

      # ubuntu-latest ships shellcheck already. Only entrypoint.sh is linted here, matching Direct's
      # own build.yml - the for_entrypoint/*.sh fixtures are exercised (not linted) below.
      - name: Shellcheck entrypoint.sh
        working-directory: Source/AgentHarnesses
        run: shellcheck entrypoint.sh

      - name: Install progress MCP server dependencies
        working-directory: Source/AgentHarnesses
        run: npm ci

      - name: Run progress MCP server specs
        working-directory: Source/AgentHarnesses
        run: npm test

      # Each fixture is a self-contained, hermetic bash script that seeds its own throwaway git
      # repositories under its own directory and exits non-zero on failure - not a bats/TAP suite,
      # so they are simply run and their exit codes checked. Every one runs even after a failure, so
      # a single broken fixture does not hide the others. Ported from Direct's build.yml unchanged.
      - name: Run entrypoint fixtures
        working-directory: Source/AgentHarnesses/for_entrypoint
        run: |
          set -uo pipefail
          status=0
          for spec in *.sh; do
            echo "::group::${spec}"
            if bash "$spec"; then
              echo "PASS: ${spec}"
            else
              echo "::error::FAILED: ${spec}"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      # Regenerates Source/Cratis.AI.Proxies/generated in place, so the drift check right after this
      # step is comparing the freshly-built tree against what is actually committed - without this,
      # the check below would just diff the checked-out tree against itself and never catch anything.
      - name: Build Cratis.AI (regenerates the proxy tree)
        run: dotnet build Source/Cratis.AI/Cratis.AI.csproj --configuration Debug

      # Generated-proxies drift gate (plan Section 4 item 3 / Section 6.3), folded into this job
      # rather than a separate workflow file - the corpus's own Source/Verification check
      # (workflows.length !== 1) requires exactly one workflow file in this repository, which the
      # parallel corpus-distribution effort (AIConsolidation.md) owns and this PR must not disturb.
      # Only Source/Cratis.AI.Proxies/generated is checked - the hand-authored package.json/
      # tsconfig.json/rollup.config.mjs/index.ts at the proxies package root are not generated and
      # legitimately change on their own. -I ignores the generator's own "@generated by Cratis ...
      # Time: <now>" header line, which otherwise makes this gate fail on every single run - the
      # timestamp is different by construction every time the generator runs, even when nothing it
      # produced actually changed (the header's own Hash: field, unaffected by -I, already proves
      # that: it is stable content hash, not wall-clock time).
      - name: Verify generated proxies are up to date
        run: |
          if [ -d Source/Cratis.AI.Proxies/generated ]; then
            git diff --exit-code -I '^// @generated by Cratis' -- Source/Cratis.AI.Proxies/generated
          else
            echo "Source/Cratis.AI.Proxies/generated does not exist yet - nothing to verify."
          fi

  dotnet-verify:
    name: dotnet verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Cratis.AI.slnx

      - name: Build Debug
        run: dotnet build Cratis.AI.slnx --configuration Debug --no-restore

      - name: Build Release
        run: dotnet build Cratis.AI.slnx --configuration Release --no-restore

      - name: Run specs
        run: dotnet test Cratis.AI.slnx --configuration Debug --no-build --logger "console;verbosity=normal"

  release:
    name: Determine semantic version
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: read
    outputs:
      publish: ${{ steps.release.outputs.should-publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine release
        id: release
        uses: cratis/release-action@f5fc6db6adbb4db6e6c4548cd7addfc924426e69 # v1.2.0
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-pi:
    name: Publish Pi package
    if: needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # yarn install, not `npm ci` - Source/Pi.Plugin is a yarn workspace member (converted in the
      # .NET-scaffolding PR) and no longer carries its own package-lock.json for `npm ci` to read.
      # `npm publish` itself needs no lockfile, only the node_modules yarn already populated.
      - name: Install workspace dependencies
        run: corepack enable && yarn install --immutable

      - name: Set package version
        working-directory: Source/Pi.Plugin
        run: npm pkg set version=${{ needs.release.outputs.version }}

      - name: Publish package
        working-directory: Source/Pi.Plugin
        run: npm publish --provenance --access public

  publish-dotnet-packages:
    name: Publish Cratis.AI (NuGet)
    if: needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for NuGet trusted publishing using OIDC tokens.
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build Source/Cratis.AI/Cratis.AI.csproj --configuration Release

      - name: Create NuGet package
        run: dotnet pack Source/Cratis.AI/Cratis.AI.csproj --no-build --configuration Release -o ./Artifacts/NuGet -p:PackageVersion=${{ needs.release.outputs.version }}

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet package
        run: dotnet nuget push --skip-duplicate './Artifacts/NuGet/*.nupkg' --timeout 900 --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  publish-npm-packages:
    name: Publish @cratis/ai (npm)
    if: needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (provenance) using OIDC tokens.
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Regenerate the proxy tree fresh rather than trust the checked-out one - the version being
      # published must reflect exactly what Source/Cratis.AI/Cratis.AI.csproj at this commit
      # produces, and the drift gate in the verify job already proved it matches what is committed,
      # so this is belt-and-braces rather than load-bearing (plan Section 6.5).
      - name: Build Cratis.AI (regenerates the proxy tree)
        run: dotnet build Source/Cratis.AI/Cratis.AI.csproj --configuration Release

      - name: Install workspace dependencies
        run: corepack enable && yarn install --immutable

      # @cratis/ai and Cratis.AI (NuGet) are published from this one release run, at this one
      # version - the generated queryName strings baked into the proxy are namespace-qualified and
      # resolved server-side from the same assembly, so a version skew between the two is a broken
      # client with no compile-time signal (plan Section 6.5, risk #13).
      - name: Set package version
        working-directory: Source/Cratis.AI.Proxies
        run: npm pkg set version=${{ needs.release.outputs.version }}

      - name: Build package
        run: yarn workspace @cratis/ai run build

      - name: Publish package
        working-directory: Source/Cratis.AI.Proxies
        run: npm publish --provenance --access public

  # Publishes the shared agent-harness images to Docker Hub. Product-neutral names now that Direct
  # is no longer the only consumer (ai-consolidation-plan.md Section 5.6) - cratis/ai-agents is the
  # base every harness derives from, never run directly; cratis/ai-agents-claude,
  # cratis/ai-agents-pi and cratis/ai-agents-copilot are what a product's dispatcher actually
  # launches, selected by the acting agent's configured harness.
  publish-agent-harnesses:
    name: Publish agent-harness images (Docker Hub)
    if: needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # DOCKER_USERNAME/DOCKER_PASSWORD are Cratis-organization secrets (visibility: all) - already
      # proven working, Studio's own publish.yml logs in to Docker Hub with these same two names.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The base image publishes first - both derivatives build FROM the tag this run just pushed,
      # never from a stale one, so a prerelease still produces internally-consistent derivatives.
      - name: Build and push the base image
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          base_args="--push --file Source/AgentHarnesses/Dockerfile.base --tag cratis/ai-agents:$VERSION"
          if [ "$PRERELEASE" != "true" ]; then
            base_args="$base_args --tag cratis/ai-agents:latest"
          fi
          # shellcheck disable=SC2086
          scripts/docker-build-push-retry.sh $base_args Source/AgentHarnesses

      - name: Build and push the Claude, Pi and Copilot derivatives
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          base="cratis/ai-agents:$VERSION"
          claude_args="--push --file Source/AgentHarnesses/Dockerfile.claude --build-arg BASE_IMAGE=$base"
          claude_args="$claude_args --tag cratis/ai-agents-claude:$VERSION"
          pi_args="--push --file Source/AgentHarnesses/Dockerfile.pi --build-arg BASE_IMAGE=$base"
          pi_args="$pi_args --tag cratis/ai-agents-pi:$VERSION"
          copilot_args="--push --file Source/AgentHarnesses/Dockerfile.copilot --build-arg BASE_IMAGE=$base"
          copilot_args="$copilot_args --tag cratis/ai-agents-copilot:$VERSION"
          if [ "$PRERELEASE" != "true" ]; then
            claude_args="$claude_args --tag cratis/ai-agents-claude:latest"
            pi_args="$pi_args --tag cratis/ai-agents-pi:latest"
            copilot_args="$copilot_args --tag cratis/ai-agents-copilot:latest"
          fi
          # shellcheck disable=SC2086
          scripts/docker-build-push-retry.sh $claude_args Source/AgentHarnesses
          # shellcheck disable=SC2086
          scripts/docker-build-push-retry.sh $pi_args Source/AgentHarnesses
          # shellcheck disable=SC2086
          scripts/docker-build-push-retry.sh $copilot_args Source/AgentHarnesses

  # Publishes the shared Decision Engine image to Docker Hub. Infrastructure deploys this by tag
  # and nothing else builds it, so without this job a Decision Engine deployment would reference an
  # image that was never pushed.
  publish-decision-engine:
    name: Publish Decision Engine image (Docker Hub)
    if: needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Contract tests use a fake router and never download model weights. Build with the same
      # Dockerfile and context that will be pushed, so packaging mistakes fail the release.
      - name: Test the Laya-backed Decision Engine image
        run: |
          docker build --file Source/DecisionEngine/Dockerfile --tag cratis/decision-engine:test Source/DecisionEngine
          docker run --rm --entrypoint python \
            --volume "$PWD/Source/DecisionEngine/tests:/tests:ro" \
            cratis/decision-engine:test -m unittest discover -s /tests

      # Weights are fetched onto a persistent volume at startup, not baked into the image.
      - name: Build and push the Decision Engine image
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          args="--push --file Source/DecisionEngine/Dockerfile --tag cratis/decision-engine:$VERSION --tag cratis/decision-engine:laya-4066d5d"
          if [ "$PRERELEASE" != "true" ]; then
            args="$args --tag cratis/decision-engine:latest"
          fi
          # shellcheck disable=SC2086
          scripts/docker-build-push-retry.sh $args Source/DecisionEngine

  verify-published:
    name: Verify a release actually shipped
    if: always() && needs.release.outputs.publish == 'true'
    needs: [release, publish-pi, publish-dotnet-packages, publish-npm-packages, publish-agent-harnesses, publish-decision-engine]
    runs-on: ubuntu-latest
    steps:
      # Cratis.AI (NuGet) and @cratis/ai (npm) are one artifact split across two registries (plan
      # Section 6.5) - either both publish or the release is broken, so they are held to a
      # stricter bar than publish-pi, which is unrelated to either.
      - name: Fail if Cratis.AI and @cratis/ai did not publish together
        if: needs.publish-dotnet-packages.result != needs.publish-npm-packages.result
        run: |
          echo "Release ${{ needs.release.outputs.version }} published Cratis.AI (${{ needs.publish-dotnet-packages.result }}) and @cratis/ai (${{ needs.publish-npm-packages.result }}) out of step with each other - one shipped and the other did not, which is exactly the version skew Section 6.5 exists to prevent." >&2
          exit 1

      - name: Fail if nothing published
        if: needs.publish-pi.result != 'success' && needs.publish-dotnet-packages.result != 'success' && needs.publish-npm-packages.result != 'success' && needs.publish-agent-harnesses.result != 'success'
        run: |
          echo "Release ${{ needs.release.outputs.version }} was determined but nothing succeeded publishing." >&2
          exit 1

      - name: Fail if the agent-harness images did not publish
        if: needs.publish-agent-harnesses.result != 'success'
        run: |
          echo "Release ${{ needs.release.outputs.version }} did not publish the agent-harness images (cratis/ai-agents*) - a product still pointed at these tags would be left on a stale image." >&2
          exit 1

      - name: Fail if the Decision Engine image did not publish
        if: needs.publish-decision-engine.result != 'success'
        run: |
          echo "Release ${{ needs.release.outputs.version }} did not publish the Decision Engine image (cratis/decision-engine) - Infrastructure deploys this by tag and nothing else builds it, so a stack moved to this version would reference an image that does not exist." >&2
          exit 1
