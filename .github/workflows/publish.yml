name: Publish Public Marketplace Distribution

# Generation and every Distribution gate run in the read-only `stage` job.
# Only `publish` may write, and it writes inside this repository: the protected
# `distribution` branch and the GitHub Release. The second generated repository
# is no longer a write target here, so this workflow mints no GitHub App token
# and reads no AI_DISTRIBUTION_APP_ credential.
#
# The tag and the installable ref are deliberately two different things.
# `cratis/release-action` computes the version and creates the canonical
# `dist/vX.Y.Z` tag and GitHub Release on `main`, which is the versioned,
# changelog-bearing, asset-hosting record. That tag must never be applied to the
# `distribution` branch, so the host-installable reference is instead the exact
# commit SHA this run pushes to that branch — still an immutable pin, just not a
# friendly tag name. The pointer manifests on `main` therefore resolve
# `distribution@<sha>`, never `dist/vX.Y.Z`.

on:
  push:
    branches: ["main"]
    paths:
      - "catalog/**"
      - "distribution/**"
      - "mcp/**"
      - "skills/**"
      - "tooling/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".github/plugin/**"
      - ".cursor-plugin/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

concurrency:
  group: publish-public-marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.should-publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the canonical repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine release from the merged pull request
        id: release
        uses: cratis/release-action@bdaded342eb31b52b48dca0611f0214794f8c655 # v1.2.0
        with:
          tag-prefix: "dist/v"
          release-notes: |
            Unsupported `0.x` public evaluation distribution.

            Generated from `Cratis/AI@${{ github.sha }}` onto the protected
            `distribution` branch. This tag and release live on `main`; the
            host-installable reference is the exact `distribution` branch commit
            recorded by the marketplace pointer manifests, because no tag is ever
            applied to that branch.

            Install, update, and uninstall commands live in
            `Documentation/maintainer-marketplace-deployment-runbook.md`.

            Marketplace availability does not imply behavior support,
            broad-rollout approval, or a stable support claim.

  stage:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out canonical AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the current generated distribution ref
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/branches/distribution" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out current generated distribution
        if: steps.current.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: distribution
          path: current-distribution
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate complete marketplace repository
        env:
          VERSION: ${{ needs.release.outputs.version }}
          CANDIDATE_VERSION: 0.0.${{ github.run_number }}-candidate.1
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^0\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^0\.0\.[0-9]+-candidate\.[0-9]+$ ]]
          mkdir -p "$GITHUB_WORKSPACE/current-distribution"
          cd source
          node tooling/stage-public-marketplace-repository.mjs \
            "$GITHUB_WORKSPACE/current-distribution" \
            "$RUNNER_TEMP/staged-distribution" \
            "$VERSION" \
            "$CANDIDATE_VERSION"
          node tooling/package-public-marketplace-submissions.mjs \
            "$RUNNER_TEMP/staged-distribution" \
            "$RUNNER_TEMP/vendor-portal-handoff"

      - name: Verify every Distribution gate
        env:
          CURRENT_EXISTS: ${{ steps.current.outputs.exists }}
        run: |
          set -euo pipefail
          validator="$GITHUB_WORKSPACE/source/distribution/repository-control-plane/.github/scripts/verify-generated-distribution.mjs"
          before_root="$GITHUB_WORKSPACE/current-distribution"
          if [ "$CURRENT_EXISTS" != "true" ]; then
            # Bootstrapping the protected branch: there is no previously
            # published tree to roll back to, so the rollback simulation runs
            # against the staged tree itself. It still exercises the complete
            # install, replace, reinstall, digest, and context-preservation path.
            before_root="$RUNNER_TEMP/staged-distribution"
          fi
          for check in \
            exact-inventory \
            canonical-byte-parity \
            native-manifest-parse \
            checksums \
            fixture-provenance-record \
            pack-install-smoke-uninstall \
            canary-rollback-simulation
          do
            arguments=(
              --root "$RUNNER_TEMP/staged-distribution"
              --check "$check"
            )
            if [ "$check" = "canary-rollback-simulation" ]; then
              arguments+=(--before-root "$before_root")
            fi
            node "$validator" "${arguments[@]}"
          done

      - name: Upload exact marketplace review tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: cratis-ai-public-marketplace-${{ needs.release.outputs.version }}
          path: |
            ${{ runner.temp }}/staged-distribution
            ${{ runner.temp }}/vendor-portal-handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  publish:
    needs: [release, stage]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: distribution-canary
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out canonical AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the current generated distribution ref
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/branches/distribution" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out current generated distribution
        if: steps.current.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: distribution
          path: current-distribution
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the exact marketplace review tree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: cratis-ai-public-marketplace-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/review

      - name: Publish the generated tree to the protected distribution branch
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          CURRENT_EXISTS: ${{ steps.current.outputs.exists }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^0\.[0-9]+\.[0-9]+$ ]]
          gh auth setup-git
          staged="$RUNNER_TEMP/review/staged-distribution"
          work="$RUNNER_TEMP/distribution-branch"
          mkdir -p "$work"
          git -C "$work" init --quiet --initial-branch distribution
          git -C "$work" config core.autocrlf false
          git -C "$work" config user.name "cratis-distribution-bot"
          git -C "$work" config user.email "distribution-bot@invalid.example"
          git -C "$work" remote add origin \
            "https://github.com/$GITHUB_REPOSITORY.git"
          if [ "$CURRENT_EXISTS" = "true" ]; then
            git -C "$work" fetch origin distribution
            git -C "$work" checkout --quiet -B distribution FETCH_HEAD
          fi
          rsync -a --delete --exclude=.git "$staged/" "$work/"
          git -C "$work" add -A
          git -C "$work" commit --allow-empty \
            --message "Publish public marketplace distribution $VERSION" \
            --message "Generated from Cratis/AI@$GITHUB_SHA by ${GITHUB_WORKFLOW}. Machine-written bytes only; never hand-edited."
          git -C "$work" push origin HEAD:refs/heads/distribution
          # The canonical dist/v$VERSION tag belongs to the release commit on
          # main and is never applied here. This exact commit is the immutable
          # ref every host installs from.
          echo "sha=$(git -C "$work" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify every Distribution gate on the published branch
        env:
          CURRENT_EXISTS: ${{ steps.current.outputs.exists }}
        run: |
          set -euo pipefail
          validator="$GITHUB_WORKSPACE/source/distribution/repository-control-plane/.github/scripts/verify-generated-distribution.mjs"
          published="$RUNNER_TEMP/distribution-branch"
          before_root="$GITHUB_WORKSPACE/current-distribution"
          if [ "$CURRENT_EXISTS" != "true" ]; then
            before_root="$published"
          fi
          for check in \
            exact-inventory \
            canonical-byte-parity \
            native-manifest-parse \
            checksums \
            fixture-provenance-record \
            pack-install-smoke-uninstall \
            canary-rollback-simulation
          do
            arguments=(
              --root "$published"
              --check "$check"
            )
            if [ "$check" = "canary-rollback-simulation" ]; then
              arguments+=(--before-root "$before_root")
            fi
            node "$validator" "${arguments[@]}"
          done

      - name: Attach the generated distribution assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/review/staged-distribution"
          handoff="$RUNNER_TEMP/review/vendor-portal-handoff"
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          cp "$staged/SHA256SUMS" "$assets/SHA256SUMS"
          cp "$staged/provenance.json" "$assets/provenance.json"
          cp "$staged/distribution-manifest.json" \
            "$assets/distribution-manifest.json"
          cp "$staged/marketplace-release.json" \
            "$assets/marketplace-release.json"
          cp "$handoff/vendor-portal-handoff.json" \
            "$assets/vendor-portal-handoff.json"
          cp "$handoff/SHA256SUMS" "$assets/vendor-portal-handoff.SHA256SUMS"
          for archive in "$handoff"/*.zip; do
            cp "$archive" "$assets/$(basename "$archive")"
          done
          # The release already exists: cratis/release-action created it on the
          # main commit that triggered this run.
          gh release upload "dist/v$VERSION" "$assets"/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Record the installable distribution commit in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          DISTRIBUTION_SHA: ${{ steps.published.outputs.sha }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Unsupported \`0.x\` public evaluation distribution."
            echo
            echo "Generated from \`Cratis/AI@$GITHUB_SHA\` onto the protected"
            echo "\`distribution\` branch as commit \`$DISTRIBUTION_SHA\`."
            echo
            echo "This tag and release live on \`main\`. The installable ref is"
            echo "the \`distribution\` branch commit above — that branch is never"
            echo "tagged, so \`dist/v$VERSION\` must not be used as an install"
            echo "pointer."
            echo
            echo "Install commands are in"
            echo "\`Documentation/maintainer-marketplace-deployment-runbook.md\`."
            echo "Marketplace availability does not imply behavior support,"
            echo "broad-rollout approval, or a stable support claim."
          } > "$notes"
          gh release edit "dist/v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cratis AI distribution $VERSION" \
            --notes-file "$notes"

      - name: Open the marketplace pointer manifest pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          DISTRIBUTION_SHA: ${{ steps.published.outputs.sha }}
        run: |
          set -euo pipefail
          gh auth setup-git
          work="$RUNNER_TEMP/pointer-manifests"
          gh repo clone "$GITHUB_REPOSITORY" "$work" -- --branch main
          node \
            "$GITHUB_WORKSPACE/source/tooling/generate-marketplace-pointer-manifests.mjs" \
            "$work" "$VERSION" "$DISTRIBUTION_SHA"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "Pointer manifests already reference distribution@$DISTRIBUTION_SHA." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node "$work/tooling/generate-repository-inventory.mjs"
          git -C "$work" add catalog/v2/repository-inventory.json
          branch="distribution-pointers/v$VERSION-${GITHUB_SHA:0:12}"
          git -C "$work" checkout --quiet -b "$branch"
          git -C "$work" config user.name "cratis-distribution-bot"
          git -C "$work" config user.email "distribution-bot@invalid.example"
          git -C "$work" commit \
            --message "Point marketplace manifests at distribution@${DISTRIBUTION_SHA:0:12}"
          git -C "$work" push origin "$branch"
          body="Generated by \`${GITHUB_WORKFLOW}\` from Cratis/AI@$GITHUB_SHA for release \`dist/v$VERSION\`. Each pointer manifest resolves its plugin from the exact commit \`$DISTRIBUTION_SHA\` on the protected \`distribution\` branch, so adding \`Cratis/AI\` as a marketplace never exposes the authored root \`skills/\` tree. The installable ref is that commit SHA, not the \`dist/v$VERSION\` tag: that tag is the versioned record on \`main\` and is never applied to the \`distribution\` branch."
          if ! gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --label no-release \
            --title "Point marketplace manifests at distribution@${DISTRIBUTION_SHA:0:12}" \
            --body "$body"
          then
            {
              echo "Could not open the pointer manifest pull request."
              echo "Branch \`$branch\` is pushed; open it by hand at"
              echo "https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
