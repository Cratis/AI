name: Publish Plugin

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLUGIN_NAME: cratis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin manifests
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          jq -e --arg plugin_name "$PLUGIN_NAME" '.name == $plugin_name' plugin.json
          jq -e --arg plugin_name "$PLUGIN_NAME" '.name == $plugin_name' .claude-plugin/plugin.json
          jq -e '.plugins | length == 1' .claude-plugin/marketplace.json

      - name: Build plugin artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/$PLUGIN_NAME"
          cp -R .ai "out/$PLUGIN_NAME/"
          cp README.md LICENSE plugin.json "out/$PLUGIN_NAME/"
          mkdir -p "out/$PLUGIN_NAME/.claude-plugin"
          cp .claude-plugin/plugin.json "out/$PLUGIN_NAME/.claude-plugin/plugin.json"
          cp .claude-plugin/marketplace.json "out/$PLUGIN_NAME/.claude-plugin/marketplace.json"
          tar -czf "out/$PLUGIN_NAME-plugin.tgz" -C out "$PLUGIN_NAME"
          (cd out && zip -rq "$PLUGIN_NAME-plugin.zip" "$PLUGIN_NAME")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cratis-ai-plugin
          path: |
            out/${{ env.PLUGIN_NAME }}-plugin.tgz
            out/${{ env.PLUGIN_NAME }}-plugin.zip
            .claude-plugin/marketplace.json

      - name: Attach assets to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/${{ env.PLUGIN_NAME }}-plugin.tgz
            out/${{ env.PLUGIN_NAME }}-plugin.zip
            .claude-plugin/marketplace.json
