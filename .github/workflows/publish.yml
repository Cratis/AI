name: Publish Plugin

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
  pull_request:
    types: [closed]
    branches:
      - '**'
    paths:
      - '**'

permissions:
  contents: write
  deployments: write
  id-token: write

env:
  PLUGIN_NAME: cratis

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin manifests
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          jq -e --arg plugin_name "$PLUGIN_NAME" '.name == $plugin_name' plugin.json
          jq -e --arg plugin_name "$PLUGIN_NAME" '.name == $plugin_name' .claude-plugin/plugin.json
          jq -e --arg plugin_name "$PLUGIN_NAME" '.name == $plugin_name and (.plugins | length == 1) and .plugins[0].name == $plugin_name' .claude-plugin/marketplace.json

      - name: Build plugin artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/$PLUGIN_NAME"
          cp -R .ai "out/$PLUGIN_NAME/"
          cp README.md LICENSE plugin.json "out/$PLUGIN_NAME/"
          mkdir -p "out/$PLUGIN_NAME/.claude-plugin"
          cp .claude-plugin/plugin.json "out/$PLUGIN_NAME/.claude-plugin/plugin.json"
          cp .claude-plugin/marketplace.json "out/$PLUGIN_NAME/.claude-plugin/marketplace.json"
          tar -czf "out/$PLUGIN_NAME-plugin.tgz" -C out "$PLUGIN_NAME"
          (cd out && zip -rq "$PLUGIN_NAME-plugin.zip" "$PLUGIN_NAME")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts
          path: |
            out/${{ env.PLUGIN_NAME }}-plugin.tgz
            out/${{ env.PLUGIN_NAME }}-plugin.zip
            .claude-plugin/marketplace.json
          if-no-files-found: error

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            out/${{ env.PLUGIN_NAME }}-plugin.tgz
            out/${{ env.PLUGIN_NAME }}-plugin.zip
            .claude-plugin/marketplace.json
