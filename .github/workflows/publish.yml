name: Publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: false
        type: string
      release-notes:
        description: Release notes
        required: false
        default: No release notes
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-intent:
    if: github.event_name == 'pull_request'
    uses: Cratis/Workflows/.github/workflows/verify-release-intent.yml@1e5319ff574ce61a771ec5199527b917204a13b5

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The three TypeScript projects moved into a yarn workspace in this PR - a single
      # `yarn install` at the root replaces the old per-project `npm ci --prefix`, which would
      # otherwise fail outright now that their package-lock.json files are gone.
      - name: Install project dependencies
        run: corepack enable && yarn install --immutable

      - name: Type check
        run: |
          yarn workspace @cratis/harness-setup run check
          yarn workspace @cratis/pi run check
          yarn workspace @cratis/ai-verification run check

      - name: Verify corpus and skill behavior
        run: yarn workspace @cratis/ai-verification run verify

      - name: Test Pi package behavior
        run: yarn workspace @cratis/ai-verification run test

      - name: Verify Pi package contents
        run: cd Source/Pi.Plugin && yarn pack --dry-run

      - name: Lint runtime shell scripts
        run: |
          mapfile -t scripts < <(find .cratis/ai/hooks/scripts -maxdepth 1 -name '*.sh' | sort)
          test ${#scripts[@]} -gt 0
          shellcheck --external-sources --severity=style "${scripts[@]}"

      - name: Reject whitespace errors
        run: git diff --check

  release:
    name: Determine semantic version
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      publish: ${{ steps.release.outputs.should-publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine release
        id: release
        uses: cratis/release-action@bdaded342eb31b52b48dca0611f0214794f8c655 # v1.2.0
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-pi:
    name: Publish Pi package
    if: needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # yarn install, not `npm ci` - Source/Pi.Plugin is a yarn workspace member and no longer
      # carries its own package-lock.json. `npm publish` itself needs no lockfile, only the
      # node_modules yarn already populated.
      - name: Install workspace dependencies
        run: corepack enable && yarn install --immutable

      - name: Set package version
        working-directory: Source/Pi.Plugin
        run: npm pkg set version=${{ needs.release.outputs.version }}

      - name: Publish package
        working-directory: Source/Pi.Plugin
        run: npm publish --provenance --access public
