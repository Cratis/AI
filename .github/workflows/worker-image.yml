name: Worker Image

# Build-only gate for the worker image. planner-publish.yml has no pull_request trigger, so
# without this workflow Source/Claude/Dockerfile (and entrypoint.sh) reach main unbuilt and a
# broken Dockerfile is discovered only by the publish run, after the merge.
#
# IMPORTANT: do NOT add this workflow's check to any required-status-checks list. It is path
# filtered, so on a PR that does not touch Source/Claude/** it never runs, and a required check
# that never runs sits at "Expected — waiting for status" and blocks the PR forever.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    paths:
      - "Source/Claude/**"

permissions:
  contents: read

jobs:
  build:
    name: Build worker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Action SHAs are copied verbatim from planner-publish.yml, which publishes this same
      # image — keep them in sync when that file is bumped.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build worker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: Source/Claude
          file: Source/Claude/Dockerfile
          push: false
