name: Planner Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Any 10.0 band. global.json asks for 10.0.0 with rollForward: latestFeature, so the
  # highest installed 10.0 band always wins. Directory.Packages.props pins
  # Microsoft.Net.Compilers.Toolset to 5.9, which matches the Roslyn version the 4xx band's
  # codestyle analyzers are built against, so no CS9057 — do not re-pin to a feature band.
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"

# Deliberately unfiltered. A workflow skipped by a `paths:` filter creates no check run at all,
# so a required status check of that name sits at "Expected — waiting for status" and the pull
# request can never merge; a job skipped by an in-job `if:` reports a `skipped` conclusion, which
# branch protection treats as passing. The former `paths:` list now lives in the `changes` job
# below. See .github/BRANCH-PROTECTION.md.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  # The single source of truth for what Backend and Frontend actually consume — the former
  # `paths:` list, unchanged in content. Analyzer configuration, the shared frontend config, the
  # solution file and the SDK pin all change what those jobs do, so a pull request touching only
  # one of them must still be checked. Always runs, so it is safe to mark required; that also
  # closes the hole where a broken gate would let every downstream job report `skipped`
  # (i.e. passing).
  changes:
    name: Planner change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # workflow_dispatch means "run everything": the filter step is skipped for it, so the raw
      # outputs are empty and this is what turns them on.
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
      any: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - '.editorconfig'
              - '.github/workflows/planner-build.yml'
              - '.globalconfig'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'Planner.slnx'
              - 'Source/**'
              - 'global.json'
            frontend:
              - '.frontend/**'
              - '.github/workflows/planner-build.yml'
              - 'Source/**'
              - 'package.json'
              - 'yarn.lock'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # CratisProxiesOutputPath is the only gate on the proxy generator: its MSBuild target is
      # Condition="'$(CratisProxiesOutputPath)' != ''". Clearing the property makes the target
      # no-op, so the Release pass cannot re-run generation over already-correct generated files.
      - name: Build (Release - zero warnings)
        run: dotnet build Source/Planner/Planner.csproj --configuration Release -p:CratisProxiesOutputPath=

      # No override here on purpose: .ai/rules/general.md makes the Debug build the canonical
      # trigger for regenerating the TypeScript proxies, so this pass must run the generator.
      - name: Build (Debug - specs compile)
        run: dotnet build Source/Planner/Planner.csproj --configuration Debug

      - name: Run specs
        run: dotnet test Source/Planner/Planner.csproj --configuration Debug --no-build

      # Placed after the specs so it cannot disturb the Debug outputs `dotnet test --no-build`
      # consumes. Composition is the Aspire AppHost; it references Planner, never the reverse, so
      # nothing else in this workflow compiles it.
      - name: Build Aspire AppHost (Release - zero warnings)
        run: dotnet build Source/Composition/Composition.csproj --configuration Release -p:CratisProxiesOutputPath=

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Yarn install
        run: corepack enable && yarn install

      - name: Run specs
        working-directory: Source/Planner
        run: yarn test

      - name: Lint
        working-directory: Source/Planner
        run: yarn lint:ci

      - name: Compile
        working-directory: Source/Planner
        run: yarn g:compile && yarn g:compile:specs

      - name: Build
        working-directory: Source/Planner
        run: yarn build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planner-frontend
          path: Source/Planner/wwwroot
          retention-days: 7

  artifacts:
    name: Publish build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, backend, frontend]
    # `!cancelled() && !failure()` is what lets this run when Backend or Frontend was *skipped*
    # rather than successful — a plain `if:` would demand success from every dependency and skip
    # this job with them. It builds everything it needs from a fresh checkout, so one of the two
    # having skipped does not make it unsound; a real failure in either still stops it.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.any == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Yarn install
        run: corepack enable && yarn install

      - name: Build frontend
        working-directory: Source/Planner
        run: yarn build

      # CratisProxiesOutputPath is the only gate on the proxy generator (its target is
      # Condition="'$(CratisProxiesOutputPath)' != ''"), so clearing it keeps this publish from
      # re-running generation over the proxies the frontend was already built against.
      - name: Publish backend
        run: >
          dotnet publish Source/Planner/Planner.csproj
          --configuration Release
          --self-contained false
          -p:UseAppHost=false
          -p:CratisProxiesOutputPath=
          -o Source/Planner/out

      # Build-only: proves Source/Planner/Dockerfile still builds before the change reaches main,
      # where planner-publish.yml is the first thing that would otherwise try it. Action SHAs are
      # copied verbatim from planner-publish.yml — keep them in sync when that file is bumped.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Planner image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: Source/Planner
          file: Source/Planner/Dockerfile
          push: false

      - name: Upload application artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planner-app
          path: Source/Planner/out
          retention-days: 7
