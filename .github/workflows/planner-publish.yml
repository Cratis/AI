name: Planner Publish

# cancel-in-progress is deliberately left off (false). This job pushes cratis/planner:latest and
# cratis/planner-worker:latest to Docker Hub; cancelling a run mid-push can leave a partially
# updated manifest, and the cancelled run may already have moved :latest. Serializing runs on the
# ref — never cancelling them — is the correct behavior for a publish job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned to the 3xx feature band on purpose. global.json asks for 10.0.0 with
  # rollForward: latestFeature, so the highest installed 10.0 band always wins. The 4xx band
  # ships codestyle analyzers built against Roslyn 5.9, while Directory.Build.props pins
  # Microsoft.Net.Compilers.Toolset to 5.6 — that combination fails the build with CS9057.
  DOTNET_VERSION: "10.0.3xx"
  NODE_VERSION: "22.x"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the images with"
        required: true
        default: "0.0.0"
        type: string
  push:
    branches:
      - main
    # An allowlist of exactly what the two images are built from — never a bare "Source/**".
    # Source/ also holds Factory.Core and Factory.Core.Specs, which are libraries that ship in
    # neither image, so a library-only commit used to republish both :latest tags to Docker Hub.
    # An allowlist fails closed: a future non-image project added under Source/ stays unpublished
    # until someone opts it in here, whereas a paths-ignore denylist would silently start
    # publishing again the moment a new folder appeared.
    paths:
      - "Directory.Packages.props"
      - "Source/Claude/**" # worker image build context
      - "Source/Directory.Build.props" # was covered by Source/**; still affects the built image
      - "Source/Directory.Build.targets"
      - "Source/Planner/**" # planner image build context

permissions:
  contents: read

jobs:
  publish-planner:
    name: Publish Planner image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Yarn install
        run: corepack enable && yarn install

      - name: Build frontend
        working-directory: Source/Planner
        run: yarn build

      - name: Publish backend
        run: >
          dotnet publish Source/Planner/Planner.csproj
          --configuration Release
          --self-contained false
          -p:UseAppHost=false
          -p:DisableProxyGenerator=true
          -o Source/Planner/out

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: Source/Planner
          file: Source/Planner/Dockerfile
          push: true
          tags: |
            cratis/planner:latest
            cratis/planner:${{ github.event.inputs.version || github.sha }}

  publish-worker:
    name: Publish worker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: Source/Claude
          file: Source/Claude/Dockerfile
          push: true
          tags: |
            cratis/planner-worker:latest
            cratis/planner-worker:${{ github.event.inputs.version || github.sha }}
