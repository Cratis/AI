name: Planner Publish

# cancel-in-progress is deliberately left off (false). This job pushes cratis/planner:latest and
# cratis/planner-worker:latest to Docker Hub; cancelling a run mid-push can leave a partially
# updated manifest, and the cancelled run may already have moved :latest. Serializing runs on the
# ref — never cancelling them — is the correct behavior for a publish job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Any 10.0 band. global.json asks for 10.0.0 with rollForward: latestFeature, so the
  # highest installed 10.0 band always wins. Directory.Packages.props pins
  # Microsoft.Net.Compilers.Toolset to 5.9, which matches the Roslyn version the 4xx band's
  # codestyle analyzers are built against, so no CS9057 — do not re-pin to a feature band.
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the images with"
        required: true
        default: "0.0.0"
        type: string
  push:
    branches:
      - main
    # An allowlist of exactly what the two images are built from — never a bare "Source/**".
    # Source/ also holds Factory.Core and Factory.Core.Specs, which are libraries that ship in
    # neither image, so a library-only commit used to republish both :latest tags to Docker Hub.
    # An allowlist fails closed: a future non-image project added under Source/ stays unpublished
    # until someone opts it in here, whereas a paths-ignore denylist would silently start
    # publishing again the moment a new folder appeared.
    paths:
      - "Directory.Packages.props"
      - "Source/Claude/**" # worker image build context
      - "Source/Directory.Build.props" # was covered by Source/**; still affects the built image
      - "Source/Directory.Build.targets"
      - "Source/Planner/**" # planner image build context

permissions:
  contents: read

jobs:
  publish-planner:
    name: Publish Planner image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Yarn install
        run: corepack enable && yarn install

      - name: Build frontend
        working-directory: Source/Planner
        run: yarn build

      # CratisProxiesOutputPath is the only gate on the proxy generator: its MSBuild target is
      # Condition="'$(CratisProxiesOutputPath)' != ''". Clearing the property makes the target
      # no-op, so this publish cannot regenerate the proxies the frontend was just built against.
      - name: Publish backend
        run: >
          dotnet publish Source/Planner/Planner.csproj
          --configuration Release
          --self-contained false
          -p:UseAppHost=false
          -p:CratisProxiesOutputPath=
          -o Source/Planner/out

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: Source/Planner
          file: Source/Planner/Dockerfile
          push: true
          tags: |
            cratis/planner:latest
            cratis/planner:${{ github.event.inputs.version || github.sha }}

  publish-worker:
    name: Publish worker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: Source/Claude
          file: Source/Claude/Dockerfile
          push: true
          tags: |
            cratis/planner-worker:latest
            cratis/planner-worker:${{ github.event.inputs.version || github.sha }}
