name: Planner Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the images with"
        required: true
        default: "0.0.0"
        type: string
  push:
    branches:
      - main
    paths:
      - "Source/**"
      - "Directory.Packages.props"

permissions:
  contents: read

jobs:
  # An image should not ship from a tree nobody tested. This workflow ran on 2026-08-20 for
  # the scheduled package update's direct push to main, succeeded, and published an image
  # from a commit whose Factory.Core specs were broken by a JsonSchema.Net major bump - there
  # was no test step here and no build workflow runs on push, so nothing objected.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build (Debug - specs compile)
        run: dotnet build Source/Planner/Planner.csproj --configuration Debug -p:DisableProxyGenerator=true

      - name: Run Planner specs
        run: dotnet test Source/Planner/Planner.csproj --configuration Debug --no-build

      - name: Run Factory.Core specs
        run: dotnet test Source/Factory.Core.Specs/Factory.Core.Specs.csproj --configuration Debug

  publish-planner:
    name: Publish Planner image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Yarn install
        run: corepack enable && yarn install

      - name: Build frontend
        working-directory: Source/Planner
        run: yarn build

      - name: Publish backend
        run: >
          dotnet publish Source/Planner/Planner.csproj
          --configuration Release
          --self-contained false
          -p:UseAppHost=false
          -p:DisableProxyGenerator=true
          -o Source/Planner/out

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Source/Planner
          file: Source/Planner/Dockerfile
          push: true
          tags: |
            cratis/planner:latest
            cratis/planner:${{ github.event.inputs.version || github.sha }}

  publish-worker:
    name: Publish worker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Source/Claude
          file: Source/Claude/Dockerfile
          push: true
          tags: |
            cratis/planner-worker:latest
            cratis/planner-worker:${{ github.event.inputs.version || github.sha }}
