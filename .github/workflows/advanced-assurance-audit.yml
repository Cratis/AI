name: Advanced Assurance Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

concurrency:
  group: advanced-assurance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete immutable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate sidelined governed assurance
        run: |
          set -euo pipefail
          node tooling/generate-support.mjs
          node tooling/generate-release-readiness.mjs
          node tooling/preview-readiness.mjs
          git diff --exit-code -- \
            catalog/v2/support.json \
            catalog/v2/release-readiness.json \
            distribution/preview-readiness.json
          node tooling/validate-catalogs.mjs
          node tooling/run-spec-suite.mjs --governed
