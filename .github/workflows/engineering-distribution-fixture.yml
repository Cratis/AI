name: Verify Engineering Distribution Fixture

on:
  workflow_dispatch:
    inputs:
      version:
        description: Engineering fixture version (0.0.N-engineering-fixture)
        required: true
        default: 0.0.1-engineering-fixture
        type: string

permissions:
  contents: read

concurrency:
  group: engineering-distribution-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the canonical authoring repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate the engineering fixture
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^0\.0\.[0-9]+-engineering-fixture$ ]]
          node tooling/generate-engineering-distribution-fixture.mjs \
            "$RUNNER_TEMP/engineering-distribution" "$VERSION"

      - name: Verify package lifecycle and context preservation
        run: |
          set -euo pipefail
          node --test tooling/specs/engineering-distribution-fixture.spec.mjs
          test "$(node -p "require('$RUNNER_TEMP/engineering-distribution/engineering-distribution-manifest.json').installationEligible")" = "false"
          test "$(node -p "require('$RUNNER_TEMP/engineering-distribution/engineering-distribution-manifest.json').publicationEligible")" = "false"
          test "$(node -p "require('$RUNNER_TEMP/engineering-distribution/engineering-distribution-manifest.json').promotionEligible")" = "false"
