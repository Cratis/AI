name: Product drift

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ai-corpus-product-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: corepack enable && yarn install --immutable

      - name: Report product drift
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_DRIFT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          status=0
          yarn workspace @cratis/ai-verification run drift --json > "$RUNNER_TEMP/product-drift.json" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "Product drift could not run (exit $status)." >&2
            exit "$status"
          fi

      - name: Reconcile the single tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: yarn workspace @cratis/ai-verification run drift-issue "$RUNNER_TEMP/product-drift.json"
