name: Verify AI Corpus

on:
    pull_request:
        paths:
            - ".ai/**"
            - ".agents/**"
            - ".github/ISSUE_TEMPLATE/**"
            - ".github/workflows/**"
            - "AGENTS.md"
            - "README.md"
            - "AI-REPOSITORY-REDESIGN-*.md"
            - "Documentation/**"
            - "catalog/**"
            - "distribution/**"
            - "engineering/**"
            - "evals/**"
            - "evidence/**"
            - "pilots/**"
            - "skills/**"
            - "tooling/**"
    push:
        branches: ["main"]
        paths:
            - ".ai/**"
            - ".agents/**"
            - ".github/ISSUE_TEMPLATE/**"
            - ".github/workflows/**"
            - "AGENTS.md"
            - "README.md"
            - "AI-REPOSITORY-REDESIGN-*.md"
            - "Documentation/**"
            - "catalog/**"
            - "distribution/**"
            - "engineering/**"
            - "evals/**"
            - "evidence/**"
            - "pilots/**"
            - "skills/**"
            - "tooling/**"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verify-ai-corpus-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out the complete evidence history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Validate the AI corpus
              run: .ai/hooks/scripts/validate-ai-setup.sh

            - name: Verify generated catalogs are current
              run: |
                  set -euo pipefail
                  node tooling/harness-registry.mjs
                  node tooling/generate-catalog-v2.mjs
                  node tooling/generate-support.mjs
                  node tooling/generate-release-readiness.mjs
                  node tooling/generate-ecosystem-artifact-coverage.mjs
                  node tooling/generate-human-catalog.mjs
                  node tooling/generate-repository-inventory.mjs
                  git diff --exit-code -- \
                    catalog/v2 \
                    catalog/generated/human-catalog \
                    distribution/artifact-matrix.json \
                    distribution/engineering-artifact-matrix.json \
                    distribution/profile-subscription.schema.json

            - name: Validate catalogs and specifications
              run: |
                  set -euo pipefail
                  node tooling/portable-compliance-validation.mjs --verify-lock
                  node tooling/release-assurance-validation.mjs
                  node tooling/benchmarks/release-generation.mjs 1
                  node tooling/validate-catalogs.mjs
                  node --test tooling/specs/*.spec.mjs

            - name: Verify strict JSON inputs
              run: |
                  node <<'NODE'
                  const { readdirSync, readFileSync } = require('node:fs');
                  const { join } = require('node:path');

                  function files(root) {
                    return readdirSync(root, { withFileTypes: true }).flatMap((entry) => {
                      const path = join(root, entry.name);
                      return entry.isDirectory() ? files(path) : [path];
                    });
                  }

                  const inputs = [
                    ...files('catalog'),
                    ...files('distribution'),
                  ].filter((path) =>
                    path.endsWith('.json') || path.endsWith('.yml'));
                  for (const path of inputs) JSON.parse(readFileSync(path, 'utf8'));
                  process.stdout.write(`Strict JSON inputs verified: ${inputs.length}\n`);
                  NODE

            - name: Reject whitespace errors
              run: git diff --check
