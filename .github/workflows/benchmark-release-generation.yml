name: Benchmark AI Release Generation

on:
    workflow_dispatch:
    schedule:
        - cron: "17 4 * * 1"

permissions:
    contents: read

concurrency:
    group: benchmark-ai-release-generation
    cancel-in-progress: true

jobs:
    benchmark:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out immutable source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Run non-blocking release generation benchmark
              run: node tooling/benchmarks/release-generation.mjs 1
