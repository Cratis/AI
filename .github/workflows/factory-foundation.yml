name: Factory Foundation

# Deliberately unfiltered triggers. A workflow skipped by a `paths:` filter creates no check run
# at all, so a required status check of that name sits at "Expected — waiting for status" and the
# pull request can never merge. A job skipped by an in-job `if:` does report a `skipped`
# conclusion, which branch protection treats as passing. So the path knowledge moved out of the
# triggers and into the `changes` job below: every check always reports, and the irrelevant ones
# report in seconds. See .github/BRANCH-PROTECTION.md.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  # Any 10.0 band. global.json asks for 10.0.0 with rollForward: latestFeature, so the
  # highest installed 10.0 band always wins. Directory.Packages.props pins
  # Microsoft.Net.Compilers.Toolset to 5.9, which matches the Roslyn version the 4xx band's
  # codestyle analyzers are built against, so no CS9057 — do not re-pin to a feature band.
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  # Exact patch pin, on purpose. markdownlint-cli2 is not a declared dependency of this
  # repository (root package.json is the Planner frontend workspace and has no docs tooling in
  # it), so the invoking workflow is the only place a version can be pinned — which is exactly
  # what the note at the top of .markdownlint-cli2.jsonc asks for. It matters: MD060 did not
  # exist before markdownlint v0.40, and its arrival alone moved this tree's finding count by
  # 138 in a single silent unpinned upgrade. 0.23.2 (markdownlint 0.41.1) is the version the
  # current zero-findings baseline was measured against. Bump it deliberately, with the
  # resulting findings reviewed in the same pull request.
  MARKDOWNLINT_CLI2_VERSION: "0.23.2"
  # Exact pin for the same reason as the one above, and it is not academic here either: a
  # shellcheck release that adds a check to the default set would turn this gate red on a pull
  # request that changed no shell at all. ubuntu-latest ships shellcheck preinstalled, but at a
  # version the runner image bumps on its own schedule — which is precisely the unpinned upgrade
  # this repository has already been bitten by — so the job downloads the pinned release instead
  # of using it. 0.11.0 is the version the current zero-findings baseline was measured against.
  # Bump it deliberately, with the resulting findings reviewed in the same pull request.
  SHELLCHECK_VERSION: "0.11.0"
  # sha256 of shellcheck-v0.11.0.linux.x86_64.tar.xz, as published by the GitHub release API.
  # The download is a tarball from a third-party release, so the pin is only worth as much as the
  # integrity check that goes with it. Update both together.
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single source of truth for what each job below cares about — the former `paths:` filters,
  # one copy instead of the two byte-identical push/pull_request copies GitHub Actions offered no
  # way to factor out. Always runs, so it is safe to mark required; that also closes the hole where
  # a broken gate would let every downstream job report `skipped` (i.e. passing).
  changes:
    name: Factory change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # workflow_dispatch means "run everything": the filter step is skipped for it, so the raw
      # outputs are empty and this is what turns them on.
      foundation: ${{ steps.filter.outputs.foundation == 'true' || github.event_name == 'workflow_dispatch' }}
      dotnet: ${{ steps.filter.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch' }}
      corpus: ${{ steps.filter.outputs.corpus == 'true' || github.event_name == 'workflow_dispatch' }}
      docs: ${{ steps.filter.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
      shell: ${{ steps.filter.outputs.shell == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      # pull_request comparisons go through the REST API and need no checkout, but the push
      # trigger above compares with git and does.
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            foundation:
              - '.github/workflows/factory-foundation.yml'
              - 'Contracts/**'
              - 'Evaluations/**'
              - 'Factory/**'
              - 'Workflows/**'
            dotnet:
              - '.editorconfig'
              - '.github/workflows/factory-foundation.yml'
              - '.globalconfig'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'Planner.slnx'
              - 'Source/Directory.Build.props'
              - 'Source/Directory.Build.targets'
              - 'Source/Factory.Core/**'
              - 'Source/Factory.Core.Specs/**'
              - 'global.json'
            corpus:
              - '.agents/**'
              - '.ai/**'
              - '.claude/**'
              - '.github/**'
              - 'AGENTS.md'
              - 'README.md'
            # `.ai/**` is here as well as under `corpus:` on purpose — the two jobs check
            # different things about the same files. `corpus` runs validate-ai-setup.sh
            # (frontmatter, adapters, drift); `docs` runs markdownlint, whose globs now cover
            # .ai/rules, .ai/skills and .ai/prompts. Without this entry a corpus-only change
            # would skip the Documentation job and go unlinted.
            docs:
              - '.ai/**'
              - '.github/workflows/factory-foundation.yml'
              - '.markdownlint-cli2.jsonc'
              - 'Documentation/**'
            # Every .sh in the tree, wherever it lives. The shell in this repository spans four
            # unrelated areas — the enforcement hooks under .ai/hooks/scripts, the docs gate, the
            # worker container entrypoint and scripts/ — and no existing filter covers more than
            # one of them. Widening `corpus` instead would run the AI-corpus validator on a
            # container-entrypoint change it knows nothing about, so this gets its own filter.
            shell:
              - '**/*.sh'
              - '.github/workflows/factory-foundation.yml'

  foundation:
    name: Deterministic Factory foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.foundation == 'true'
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Factory/requirements.txt

      - name: Snapshot the pristine checkout
        shell: bash
        run: git status --porcelain --untracked-files=all --ignored > "$RUNNER_TEMP/checkout-before.txt"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --requirement Factory/requirements.txt

      - name: Reject generated build output in immutable fixtures
        shell: bash
        run: |
          # Fixtures are hashed by content, so build output that is merely *present* on disk
          # corrupts the hash. Those paths are gitignored and can therefore never be tracked,
          # which makes the git ls-files check alone near-vacuous — find is the real guard.
          present="$(find Factory/Fixtures -type d \( -name bin -o -name obj \) -print)"
          tracked="$(git ls-files 'Factory/Fixtures/**/bin/**' 'Factory/Fixtures/**/obj/**')"
          if [[ -n "$present" || -n "$tracked" ]]; then
            echo "Generated build output is not valid immutable fixture input:" >&2
            if [[ -n "$present" ]]; then printf '%s\n' "$present" >&2; fi
            if [[ -n "$tracked" ]]; then printf '%s\n' "$tracked" >&2; fi
            exit 1
          fi

      - name: Validate Factory definitions
        run: python Factory/scripts/validate_factory.py --format json-compact

      - name: Run Factory tests
        run: python -m unittest discover -s Factory/scripts -p 'test_*.py'

      - name: Run and save executable evaluations
        run: >-
          python Factory/scripts/evaluate_factory.py
          --format json
          --output "$RUNNER_TEMP/factory-evaluation.json"

      - name: Authoritatively verify saved evaluations
        run: >-
          python Factory/scripts/evaluate_factory.py
          --verify-result "$RUNNER_TEMP/factory-evaluation.json"
          --format json-compact

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/factory-pycache
        run: python -m py_compile Factory/scripts/*.py

      - name: Verify the checks did not modify the checkout
        shell: bash
        run: |
          # --ignored is the point: bin/, obj/ and __pycache__ are exactly the output a check is
          # most likely to drop, and they are invisible to a plain --untracked-files=all status.
          # Diffing against the pristine snapshot keeps the check honest without assuming the
          # checkout started empty.
          git status --porcelain --untracked-files=all --ignored > "$RUNNER_TEMP/checkout-after.txt"
          if ! diff -u "$RUNNER_TEMP/checkout-before.txt" "$RUNNER_TEMP/checkout-after.txt"; then
            echo "Factory checks modified the source checkout." >&2
            exit 1
          fi

  dotnet:
    name: Factory .NET libraries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Release is the strict gate: Source/Directory.Build.props turns on TreatWarningsAsErrors
      # for Release only. CratisProxiesOutputPath is cleared so the Release pass cannot re-run
      # proxy generation over already-correct generated files.
      - name: Build (Release - zero warnings)
        run: dotnet build Source/Factory.Core.Specs/Factory.Core.Specs.csproj --configuration Release -p:CratisProxiesOutputPath=

      - name: Build (Debug - specs compile)
        run: dotnet build Source/Factory.Core.Specs/Factory.Core.Specs.csproj --configuration Debug

      - name: Run specs
        run: dotnet test Source/Factory.Core.Specs/Factory.Core.Specs.csproj --configuration Debug --no-build

  ai-corpus:
    name: AI corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.corpus == 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate AI corpus
        run: bash .ai/hooks/scripts/validate-ai-setup.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs == 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # yarn rather than npx: package.json pins packageManager to yarn@4, and corepack's npm shim
      # refuses to run under that pin. planner-build.yml already standardizes on corepack.
      - name: Enable Corepack
        run: corepack enable

      # The blocking half. No glob argument on purpose — .markdownlint-cli2.jsonc carries the
      # globs and the ignores, so this lints exactly what a bare local run does: the 25
      # Documentation pages plus the 139 markdown files of the .ai/ instruction corpus, 164
      # in total. The corpus is the repository's primary product and is propagated to every
      # other Cratis repo, so it is linted by the same blocking gate as the docs.
      - name: Lint documentation and AI corpus markdown
        run: yarn dlx markdownlint-cli2@${{ env.MARKDOWNLINT_CLI2_VERSION }}

      # The advisory half, and the only thing in CI that runs Documentation/verify-markdown.sh at
      # all. It re-lints (unpinned, via its own npx) and then link-checks with linkinator, which
      # reaches the network for the one external URL in the tree. A network round trip is not a
      # sound blocking merge gate — a github.com rate-limit on a shared runner would fail a pull
      # request that changed nothing — so this step is deliberately non-blocking. The accepted
      # trade-off: broken links do not stop a merge, they only show up as a red step inside a
      # green job, and someone has to look. Its unpinned lint is a bonus early warning that the
      # pin above is behind. Its own summary names which half failed.
      - name: Verify documentation links and script (advisory, non-blocking)
        continue-on-error: true
        run: bash Documentation/verify-markdown.sh

  # Blocking, unlike the link check above, and the difference is determinism. shellcheck is a
  # static parser over files already in the checkout: no network at check time, no shared-runner
  # rate limit, no flake to trade away. The scripts it guards also earn a hard gate — the six
  # under .ai/hooks/scripts are propagated to every Cratis repository and run on each agent write
  # and turn end, so a `set -e` mistake there fails open across the fleet, silently. Two such bugs
  # (a `grep -rl` whose no-match exit killed a loop, and a bare command that made a failure report
  # unreachable) were found here by hand before this job existed; both are ordinary shellcheck
  # findings.
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.shell == 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned shellcheck
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/shellcheck.tar.xz" "$url"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Lint shell scripts
        shell: bash
        run: |
          set -euo pipefail

          # Selection is by shebang, not by path. shellcheck parses the sh family only and errors
          # out with SC1071 on anything else, and Factory/Migration carries two zsh scripts that
          # would fail the job on sight. Reading the first line keeps a new bash script anywhere in
          # the tree covered automatically, and a new zsh one out of the way, with no list to
          # maintain here.
          scripts=()
          while IFS= read -r script; do
            case "$(head -n 1 "$script")" in
              *zsh | *fish | *python*) continue ;;
            esac
            scripts+=("$script")
          done < <(find . -name '*.sh' \
            -not -path './.git/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/.yarn/*' \
            -not -path '*/bin/*' \
            -not -path '*/obj/*' | sort)

          # The filter that starts this job matches '**/*.sh', so an empty list means every shell
          # script in the repository was deleted, not that there is nothing to check. Say so rather
          # than reporting a green check that verified nothing.
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No sh/bash scripts found, but the change filter matched '**/*.sh'." >&2
            echo "If the last shell script really was removed, drop this job and its filter." >&2
            exit 1
          fi

          echo "Checking ${#scripts[@]} script(s) with $(shellcheck --version | awk '/^version:/ {print $2}'):"
          printf '  %s\n' "${scripts[@]}"
          echo

          # -x follows `source`d files, which is what makes the three hooks that pull in
          # hook-lib.sh check as the single program they actually are. --severity=style is the
          # shellcheck default today; naming it pins the threshold so a future release cannot
          # loosen this gate without the version bump above being reviewed.
          shellcheck --external-sources --severity=style --format=gcc "${scripts[@]}"
          echo "shellcheck: zero findings."
