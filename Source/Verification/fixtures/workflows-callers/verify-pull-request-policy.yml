# [vendored] commit: 5823f48dfccfd6a2522ffa9035655d43f2aff17b; refresh with CRATIS_CONTRACT_LIVE=1 to detect drift
name: Verify Pull Request Policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    uses: Cratis/Workflows/.github/workflows/verify-pull-request-policy.yml@main
    with:
      runs-on: ${{ vars.RUNNER_GATE || '__POLICY_RUNNER__' }}
      release-intent: __RELEASE_INTENT__
